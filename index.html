<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinite World — Terrain Flight Prototype</title>
  <style>
    :root {
      --hud-bg: rgba(5, 10, 16, 0.38);
      --hud-text: #dce8f2;
      --hud-accent: #8fd0ff;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1218;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }
    canvas {
      position: fixed;
      inset: 0;
      display: block;
    }
    #hud {
      position: fixed;
      left: 14px;
      top: 14px;
      z-index: 10;
      display: grid;
      grid-template-columns: auto auto;
      column-gap: 10px;
      row-gap: 4px;
      padding: 10px 12px;
      color: var(--hud-text);
      background: var(--hud-bg);
      border: 1px solid rgba(120, 160, 190, 0.22);
      border-radius: 6px;
      backdrop-filter: blur(4px);
      font-size: 12px;
      line-height: 1.35;
      user-select: none;
      pointer-events: none;
    }
    #hud .label { color: #7fa2ba; }
    #hud .value { text-align: right; color: var(--hud-accent); min-width: 92px; }
    #hud .boost { color: #ffd166; }
    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 11;
      width: 5px;
      height: 5px;
      margin: -3px 0 0 -3px;
      border-radius: 50%;
      background: rgba(230, 242, 252, 0.85);
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.7);
      pointer-events: none;
    }
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, rgba(8, 14, 22, 0.18), rgba(4, 7, 11, 0.72));
      color: #dce8f2;
      cursor: pointer;
      text-align: center;
      user-select: none;
    }
    #overlay.hidden { display: none; }
    #overlay .card {
      max-width: 620px;
      padding: 26px 34px;
      background: rgba(8, 16, 24, 0.72);
      border: 1px solid rgba(140, 180, 210, 0.25);
      border-radius: 10px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
    }
    #overlay h1 {
      margin: 0 0 10px;
      font-size: 22px;
      letter-spacing: 0.06em;
    }
    #overlay p { margin: 6px 0; font-size: 13px; color: #a9bccc; }
    #overlay .keys { color: #8fd0ff; }
    #overlay .start {
      display: inline-block;
      margin-top: 14px;
      padding: 8px 18px;
      border: 1px solid rgba(140, 200, 255, 0.45);
      border-radius: 5px;
      color: #bfe4ff;
      font-size: 13px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <span class="label">POS</span><span class="value" id="hud-pos">—</span>
    <span class="label">ALT</span><span class="value" id="hud-alt">—</span>
    <span class="label">SPEED</span><span class="value" id="hud-speed">—</span>
    <span class="label">TILES</span><span class="value" id="hud-tiles">—</span>
    <span class="label">FPS</span><span class="value" id="hud-fps">—</span>
    <span class="label">SEED</span><span class="value" id="hud-seed">—</span>
  </div>
  <div id="crosshair"></div>
  <div id="overlay">
    <div class="card">
      <h1>Infinite Terrain Flight</h1>
      <p><span class="keys">W / S</span> throttle &nbsp;·&nbsp; <span class="keys">A / D</span> strafe &nbsp;·&nbsp; <span class="keys">Shift</span> boost</p>
      <p><span class="keys">Space / Ctrl</span> climb / descend &nbsp;·&nbsp; <span class="keys">Mouse</span> look &nbsp;·&nbsp; <span class="keys">Wheel</span> trim throttle</p>
      <p>LOD radius up to 512 km · deterministic layered terrain</p>
      <div class="start">Click to enter pointer lock and fly</div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
